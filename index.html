<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORTHAR CHARACTER SHEET</title>
  <!-- Library for PNG Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #10b981;
      --border-color: #33333d;
      --text-color: #e4e4e7;
      --muted-text: #a1a1aa;
      --input-bg: #141417;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #sheet-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 1.5px;
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .section-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted-text);
      margin: 16px 0 8px 0;
    }

    /* Editable Text Fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-row label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted-text);
      min-width: 110px;
    }

    .field-row input[type="text"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }

    .field-row input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    /* Responsive Clustered Details Grid */
    .details-cluster {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }

    .details-cluster .field-row label {
      min-width: 80px;
    }

    /* On screens 420px wide and up, convert cluster to 2 columns */
    @media (min-width: 420px) {
      .details-cluster {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .details-cluster .field-row:nth-child(5) {
        grid-column: span 2; /* Willpower spans full width */
      }
    }

    /* Stat Rows & Dots */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-label-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pool-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .stat-name {
      font-size: 0.95rem;
    }

    /* 5-Dot Styling */
    .dots-group {
      display: flex;
      gap: 4px;
    }

    .dots-group input[type="radio"] {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #52525b;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    .dots-group input[type="radio"]:checked {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    /* Pool Display */
    .pool-card {
      margin-top: 20px;
      background: #141417;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .pool-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 4px 0;
    }

    .roll-output {
      font-size: 0.9rem;
      color: var(--text-color);
      min-height: 28px;
      margin-top: 8px;
    }

    /* Buttons */
    .button-group {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-roll {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-roll:hover {
      background-color: #059669;
    }

    .btn-export {
      background-color: #27272a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-export:hover {
      background-color: #3f3f46;
    }
  </style>
</head>
<body>

  <!-- SHEET CONTAINER -->
  <div id="sheet-container">
    <h1>SCORTHAR CHARACTER SHEET</h1>

    <!-- PLAYER & CHARACTER INFORMATION -->
    <div class="section-header">Identity</div>
    <div class="field-group">
      <div class="field-row">
        <label for="player-name">Player Name:</label>
        <input type="text" id="player-name" placeholder="Enter player name...">
      </div>
      <div class="field-row">
        <label for="char-name">Character Name:</label>
        <input type="text" id="char-name" placeholder="Enter character name...">
      </div>
    </div>

    <!-- CLUSTERED CHARACTER DETAILS -->
    <div class="section-header">Character Traits</div>
    <div class="details-cluster">
      <div class="field-row">
        <label for="soul">Soul:</label>
        <input type="text" id="soul" placeholder="...">
      </div>
      <div class="field-row">
        <label for="mask">Mask:</label>
        <input type="text" id="mask" placeholder="...">
      </div>
      <div class="field-row">
        <label for="vice">Vice:</label>
        <input type="text" id="vice" placeholder="...">
      </div>
      <div class="field-row">
        <label for="merit">Merit:</label>
        <input type="text" id="merit" placeholder="...">
      </div>
      <div class="field-row">
        <label for="willpower">Willpower:</label>
        <input type="text" id="willpower" placeholder="...">
      </div>
    </div>

    <!-- ATTRIBUTES SECTION -->
    <div class="section-header">Attributes</div>
    
    <div class="stat-row">
      <div class="stat-label-group">
        <input type="checkbox" class="pool-checkbox" data-stat="attr_tech" onchange="updatePool()">
        <span class="stat-name">Tech / Craft</span>
      </div>
      <div class="dots-group">
        <input type="radio" name="attr_tech" value="1" onchange="updatePool()">
        <input type="radio" name="attr_tech" value="2" onchange="updatePool()">
        <input type="radio" name="attr_tech" value="3" checked onchange="updatePool()">
        <input type="radio" name="attr_tech" value="4" onchange="updatePool()">
        <input type="radio" name="attr_tech" value="5" onchange="updatePool()">
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-label-group">
        <input type="checkbox" class="pool-checkbox" data-stat="attr_phys" onchange="updatePool()">
        <span class="stat-name">Physical</span>
      </div>
      <div class="dots-group">
        <input type="radio" name="attr_phys" value="1" onchange="updatePool()">
        <input type="radio" name="attr_phys" value="2" checked onchange="updatePool()">
        <input type="radio" name="attr_phys" value="3" onchange="updatePool()">
        <input type="radio" name="attr_phys" value="4" onchange="updatePool()">
        <input type="radio" name="attr_phys" value="5" onchange="updatePool()">
      </div>
    </div>

    <!-- BOONS SECTION -->
    <div class="section-header">Boons</div>

    <div class="stat-row">
      <div class="stat-label-group">
        <input type="checkbox" class="pool-checkbox" data-stat="boon_savant" onchange="updatePool()">
        <span class="stat-name">Idiot Savant</span>
      </div>
      <div class="dots-group">
        <input type="radio" name="boon_savant" value="1" onchange="updatePool()">
        <input type="radio" name="boon_savant" value="2" onchange="updatePool()">
        <input type="radio" name="boon_savant" value="3" onchange="updatePool()">
        <input type="radio" name="boon_savant" value="4" onchange="updatePool()">
        <input type="radio" name="boon_savant" value="5" checked onchange="updatePool()">
      </div>
    </div>

    <!-- POOL DISPLAY -->
    <div class="pool-card">
      <div>Active Dice Pool</div>
      <div class="pool-number" id="pool-score">0</div>
      <div class="roll-output" id="roll-output">Check the boxes next to stats to build your pool.</div>
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="button-group">
    <button class="btn-roll" onclick="rollPool()">Roll Dice</button>
    <button class="btn-export" onclick="exportSheet()">Export PNG</button>
  </div>

  <script>
    // Calculate total pool from checked checkboxes
    function updatePool() {
      let totalPool = 0;
      const checkboxes = document.querySelectorAll('.pool-checkbox:checked');

      checkboxes.forEach(cb => {
        const statName = cb.getAttribute('data-stat');
        const selectedDot = document.querySelector(`input[name="${statName}"]:checked`);
        if (selectedDot) {
          totalPool += parseInt(selectedDot.value);
        }
      });

      document.getElementById('pool-score').textContent = totalPool;
      return totalPool;
    }

    // Roll d10s equal to the active pool score
    function rollPool() {
      const poolSize = updatePool();
      if (poolSize <= 0) {
        document.getElementById('roll-output').innerHTML = "<span style='color:#ef4444;'>Select at least one stat box to roll!</span>";
        return;
      }

      let rolls = [];
      let successes = 0;

      for (let i = 0; i < poolSize; i++) {
        const roll = Math.floor(Math.random() * 10) + 1;
        rolls.push(roll);
        if (roll >= 8) successes++;
      }

      document.getElementById('roll-output').innerHTML = 
        `Rolls: [ <strong>${rolls.join(', ')}</strong> ]<br>Successes (8+): <strong>${successes}</strong>`;
    }

    // Export sheet container as PNG image
    function exportSheet() {
      const element = document.getElementById('sheet-container');
      html2canvas(element).then(canvas => {
        const link = document.createElement('a');
        link.download = 'scorthar-character-sheet.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
